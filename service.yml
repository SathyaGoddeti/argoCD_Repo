---
apiVersion: v1
kind: Service
metadata:
  name: firstservice
  namespace: dev
spec:
  # A headless Service is required for stable StatefulSet network identities.
  clusterIP: None
  selector:
    app: mystatefulset
    env: devenv
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: deploymentservice
  namespace: dev
spec:
  type: LoadBalancer
  selector:
    app: mydeployment
    env: devenv
  ports:
    - name: http
      port: 80
      targetPort: 80
